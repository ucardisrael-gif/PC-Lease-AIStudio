<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вращение логотипа на тёмном экране</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3f7;color:#193047;font:16px/1.55 system-ui,Arial,sans-serif}main{max-width:1180px;margin:auto;padding:35px 20px 60px}h1{font-size:clamp(26px,4vw,40px);line-height:1.15}p{color:#566d7d}.tag{font-size:12px;letter-spacing:.1em;font-weight:bold;color:#1478b9}.scene{position:relative;overflow:hidden;border-radius:14px;line-height:0;box-shadow:0 18px 48px #163d5c2e}.photo{display:block;width:100%;height:auto}.screen{position:absolute;inset:0;clip-path:polygon(10.9% 29%,35.6% 30.6%,38.2% 59%,14.6% 66.5%);background:#070c13}.logo-place{position:absolute;left:15.8%;top:43%;width:17%;transform:rotate(-3deg) skewX(8deg);perspective:500px}.logo-frame{position:relative;width:100%;aspect-ratio:3.86;overflow:hidden;animation:rotate 5s linear infinite;filter:brightness(1.85) drop-shadow(0 0 4px #66c4ff)}.logo-frame img{position:absolute;left:50%;top:50%;width:520%;max-width:none;height:auto;transform:translate(-50%,-50%)}.scene.paused .logo-frame{animation-play-state:paused}button{font:inherit;cursor:pointer;background:#1766a9;color:white;border:0;border-radius:10px;padding:11px 18px;margin:10px 0 22px}button:focus-visible{outline:3px solid #168bd5;outline-offset:4px}.hint{font-size:14px}@keyframes rotate{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}@media(prefers-reduced-motion:reduce){.logo-frame{animation:none!important;transform:none!important}}@media(max-width:600px){main{padding:22px 14px}.scene{border-radius:10px}}
</style></head><body><main><span class="tag">PC-LEASE · ОТДЕЛЬНЫЙ ПРЕДПРОСМОТР</span><h1>Вращающийся логотип на тёмном экране</h1><p>Логотип медленно вращается без остановок. Кнопка позволяет поставить движение на паузу.</p><button id="pause" type="button" aria-pressed="false">Пауза</button><div class="scene" id="scene"><img class="photo" src="public/brand/hero_laptop_clean.jpg" alt="Ноутбук на столе в офисе"><div class="screen" aria-hidden="true"></div><div class="logo-place" aria-hidden="true"><div class="logo-frame"><img src="public/brand/logo-originals/logo-transparent.png" alt=""></div></div></div><p class="hint" id="status" aria-live="polite">Если в настройках устройства включено уменьшение движения, логотип будет показан неподвижно.</p></main><script>const scene=document.querySelector('#scene'),button=document.querySelector('#pause');button.addEventListener('click',()=>{const paused=scene.classList.toggle('paused');button.setAttribute('aria-pressed',String(paused));button.textContent=paused?'Продолжить':'Пауза'});</script></body></html>
